name: devsecops-pipeline
on: 
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.README.md'
jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Secret Scanning
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
