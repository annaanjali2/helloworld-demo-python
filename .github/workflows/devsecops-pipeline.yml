name: devsecops-pipeline
on: push
jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@7
      with:
        fetch-depth: 0
        
    - name: Secret Scanning
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
